name: GitHub Pages

# Publishes the browser game as static files. GitHub Pages cannot run the Node game server, so this build
# runs the server lobby inside a Web Worker: matches against the AI work fully; online modes need the
# server (set the repository variable GAME_SERVER_URL, e.g. wss://my-game.onrender.com/ws, to enable them).
on:
  push:
    branches: [main, claude/mobile-rts-architecture-na89at]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static client
        run: npx vite build packages/client
        env:
          VITE_STATIC: '1'
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
