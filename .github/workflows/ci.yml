# CI: runs on every push and pull request. Must be green before anything merges.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, test, build (game)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit, simulation and server integration tests
        run: npm test
      - name: Validate game data and maps
        run: npm run validate-data
      - name: Build client and server
        run: npm run build
      - name: Server performance benchmark (report only)
        run: npm run benchmark -- 100,300 30 | tee benchmark.md
      - name: Browser smoke test (headless Chromium, WebGL via SwiftShader)
        run: |
          npx playwright install --with-deps chromium
          PORT=8080 node packages/server/dist/server.mjs &
          sleep 2
          node scripts/smoke.mjs http://localhost:8080 screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: |
            screenshots
            benchmark.md
          retention-days: 14

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: conflict-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --redact --verbose --exit-code 1

  legacy-dotnet:
    name: Legacy C# prototype (to be removed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ConflictCore.sln --locked-mode
      - run: dotnet build ConflictCore.sln --no-restore -c Release
      - run: dotnet test ConflictCore.sln --no-build -c Release
