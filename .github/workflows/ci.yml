# Core CI: runs on every push and pull request. Must be green before anything merges.
# Covers everything that builds without a Unity licence: shared code, server, client logic, tools, data.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  dotnet:
    name: Build, lint & test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore ConflictCore.sln --locked-mode

      - name: Check formatting & code style
        run: dotnet format ConflictCore.sln --no-restore --verify-no-changes --verbosity minimal

      - name: Build (warnings are errors)
        run: dotnet build ConflictCore.sln --no-restore -c Release

      - name: Test
        run: >
          dotnet test ConflictCore.sln --no-build -c Release
          --logger "trx;LogFilePrefix=results"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Validate game data
        run: dotnet run --project Tools/ConflictCore.DataValidator -c Release --no-build -- Data

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  server-image:
    name: Build match server image
    runs-on: ubuntu-latest
    needs: dotnet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          push: false
          tags: conflictcore/match-server:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --redact --verbose --exit-code 1
