# Signed Android App Bundle for store submission. Runs only for version tags or manual dispatch and
# targets the protected "production" environment, which requires reviewer approval and holds the signing
# secrets. Store upload is PLANNED (Phase 10); today the signed AAB is published as an artifact.
name: Android Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    name: Signed AAB
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Read and check version
        id: version
        run: |
          VERSION="$(cat VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file (${VERSION})."
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Client
          targetPlatform: Android
          buildMethod: ConflictCore.Client.Editor.BuildScript.BuildAndroid
          androidExportType: androidAppBundle
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          versioning: Custom
          version: ${{ steps.version.outputs.value }}
          androidVersionCode: ${{ github.run_number }}
          buildName: ConflictCore
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/Android
          retention-days: 30
