# Publishes the match server container image to GitHub Container Registry.
#   develop → :develop (+ sha)    main → :main (+ sha)    tag vX.Y.Z → :X.Y.Z
# Rollout to the staging / production fleets is PLANNED (Phase 9/10, see docs/DEPLOYMENT.md); those jobs
# will be added behind the "staging" and "production" environments with required reviewers.
name: Server Image

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths: ["Server/**", "Shared/**", "Data/**", "Directory.*.props", "global.json", "VERSION", ".github/workflows/server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/conflictcore-match-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
